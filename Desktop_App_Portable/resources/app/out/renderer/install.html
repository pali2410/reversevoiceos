<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws:"
    />
    <title>Install VoiceOS</title>
    <script type="module" crossorigin src="./assets/install-PC_gAxZ_.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/install-B1F5E0HW.css">
  </head>
  <body>
    <div class="titlebar" aria-hidden="true"></div>
    <main aria-labelledby="instruction">
      <h1 id="instruction">
        To install, <em>drag</em> VoiceOS<br />to Applications
      </h1>
      <div
        class="install-item app-item"
        draggable="true"
        tabindex="0"
        role="button"
        aria-label="Move VoiceOS to Applications"
        aria-describedby="instruction"
      >
        <img
          class="app-icon"
          src="./assets/icon-DkPb6-F6.png"
          alt=""
          draggable="false"
        />
        <span class="item-label">VoiceOS</span>
      </div>
      <svg class="arrow" viewBox="0 0 112 64" fill="none" aria-hidden="true">
        <path
          d="M10 13C3 37 22 50 40 43C53 38 61 20 51 18C41 16 40 31 54 38C69 46 89 39 104 26M91 25L104 26L103 39"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <div
        class="install-item folder-item"
        role="button"
        tabindex="0"
        aria-label="Applications: move VoiceOS here"
      >
        <svg
          class="folder"
          viewBox="0 0 112 100"
          fill="none"
          aria-hidden="true"
        >
          <defs>
            <linearGradient
              id="folder-back"
              x1="56"
              y1="10"
              x2="56"
              y2="94"
              gradientUnits="userSpaceOnUse"
            >
              <stop stop-color="#86cff9" />
              <stop offset="1" stop-color="#49a2e7" />
            </linearGradient>
            <linearGradient
              id="folder-front"
              x1="56"
              y1="30"
              x2="56"
              y2="94"
              gradientUnits="userSpaceOnUse"
            >
              <stop stop-color="#99dafd" />
              <stop offset="1" stop-color="#5ab5ef" />
            </linearGradient>
          </defs>
          <path
            d="M4 20a8 8 0 0 1 8-8h28l10 10h50a8 8 0 0 1 8 8v56a8 8 0 0 1-8 8H12a8 8 0 0 1-8-8Z"
            fill="url(#folder-back)"
            stroke="#439bd5"
            stroke-opacity=".45"
          />
          <rect
            x="4"
            y="32"
            width="104"
            height="62"
            rx="8"
            fill="url(#folder-front)"
            stroke="#63b4e9"
          />
          <path
            d="M12 33h88"
            stroke="white"
            stroke-opacity=".6"
            stroke-linecap="round"
          />
          <g stroke="#2985c4" stroke-width="5.5" stroke-linecap="round">
            <path d="m49 47 22 34M61 47 39 81M36 71h40" />
          </g>
        </svg>
        <span class="item-label">Applications</span>
      </div>
    </main>
  </body>
</html>
